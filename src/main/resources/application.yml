spring:
  application:
    name: opsflow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opsflow}
    username: ${SPRING_DATASOURCE_USERNAME:opsflow}
    password: ${SPRING_DATASOURCE_PASSWORD:opsflow}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/opsflow}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: DEBUG

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}